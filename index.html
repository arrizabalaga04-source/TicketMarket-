<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketMarket | Marketplace Independiente de Entradas</title>
  <meta name="description" content="Encontrá tu entrada. No te pierdas el evento. Compra y venta transparente de entradas entre usuarios.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #F8F9FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F3F4F6;
      
      --brand-dark: #064E3B;
      --brand-accent: #047857;
      --brand-soft: #ECFDF5;
      --brand-border: #D1FAE5;
      
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-light: #64748B;
      
      --border-color: #E2E8F0;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 20px 30px -10px rgba(6, 78, 59, 0.08);
      
      --font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .brand-logo {
      font-family: var(--font-heading);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--brand-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      background-color: var(--brand-accent);
      border-radius: 50%;
      display: inline-block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--brand-dark);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: var(--brand-dark);
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(6, 78, 59, 0.15);
    }

    .btn-primary:hover {
      background-color: var(--brand-accent);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
      border-color: #CBD5E1;
    }

    .hero {
      padding: 72px 0 56px;
      background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--border-color);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 48px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background-color: var(--brand-soft);
      border: 1px solid var(--brand-border);
      border-radius: 100px;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--brand-accent);
      border-radius: 50%;
    }

    .hero-title {
      font-size: 46px;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: var(--text-main);
      margin-bottom: 18px;
      font-weight: 800;
    }

    .hero-subtitle {
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 540px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }

    .hero-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-card-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-light);
    }

    .status-pill {
      font-size: 12px;
      font-weight: 600;
      background-color: #FEF3C7;
      color: #92400E;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .section-title-wrap {
      margin-bottom: 32px;
    }

    .section-tag {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--brand-accent);
      margin-bottom: 6px;
      display: block;
    }

    .section-title {
      font-size: 30px;
      letter-spacing: -0.8px;
      color: var(--text-main);
    }

    .events-section {
      padding: 64px 0;
    }

    .listing-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 420px 1fr;
    }

    .listing-image-wrapper {
      position: relative;
      background-color: #064E3B;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .listing-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .listing-badge-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(6, 78, 59, 0.92);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
    }

    .listing-content {
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .event-category {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-accent);
      margin-bottom: 8px;
      display: block;
    }

    .event-title {
      font-size: 28px;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .event-description {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 18px;
      background-color: var(--bg-primary);
      border-radius: var(--radius-md);
      margin-bottom: 28px;
    }

    .spec-item {
      display: flex
